<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservadito Admin Panel · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #0f172a; --accent: #2563eb; --accent-ink: #60a5fa; --line: rgb(148 163 184 / 0.15); }
.glow { right: -80px; top: -120px; width: 520px; height: 520px;
  background: radial-gradient(circle, rgb(37 99 235 / 0.18), rgb(5 150 105 / 0.08) 55%, transparent 75%); }
.chip { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: #fff; }
.chip img { width: 28px; }
.tag { margin-top: 30px; }
h1 { --h1: 44px; margin: 22px 0 18px; }
.visual { display: flex; justify-content: center; }
.login { width: 380px; padding: 34px 32px; text-align: center; }
.login strong { display: block; font-size: 20px; }
.login small { display: block; margin: 4px 0 24px; font-size: 13px; color: #64748b; }
.field { display: grid; gap: 6px; margin-bottom: 16px; text-align: left; font-size: 12px; font-weight: 600; color: #94a3b8; }
.field div { padding: 11px 14px; border: 1px solid rgb(148 163 184 / 0.18); border-radius: 8px; background: #0f172a; font-size: 13px; font-weight: 400; color: #475569; }
.submit { padding: 12px 0; border-radius: 8px; background: #059669; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
<div class="canvas split">
  <div class="glow"></div>
  <div class="text stack">
    <div class="brand"><span class="chip"><img src="assets/reservadito-logo-blue.png" alt=""></span><div><div class="brand-name">Reservadito</div><div class="brand-sub">Admin panel</div></div></div>
    <span class="tag">Internal tool</span>
    <h1>Support and payouts,<br><span class="accent">without the noise</span></h1>
    <p class="tagline">Support businesses and users, review bookings and payouts, and manage plans and app versions, isolated from the client and business apps.</p>
  </div>
  <div class="visual">
    <div class="panel login">
      <strong>Reservadito</strong><small>Panel de Administración</small>
      <label class="field">Email<div>admin@reservadito.mx</div></label>
      <label class="field">Contraseña<div>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div></label>
      <div class="submit">Iniciar sesión</div>
    </div>
  </div>
</div>

</body>
</html>
