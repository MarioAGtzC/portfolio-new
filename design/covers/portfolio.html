<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portfolio · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #0e1411; --grid: rgb(228 235 230 / 0.06); --grid-size: 28px; --accent: #5cc27a; --ink: #e4ebe6; --muted: #b4c1b8;
  --line: #26332b; --surface: #151d18; }
.glow { background: radial-gradient(circle, rgb(92 194 122 / 0.16), transparent 65%); }
.brand-name { font-size: 22px; font-weight: 600; }
.gdot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgb(92 194 122 / 0.18); }
.api { display: inline-flex; align-items: center; gap: 10px; font: 500 15px 'Geist Mono', monospace; color: #93a399; }
.verb { padding: 3px 8px; border-radius: 5px; background: var(--accent); color: var(--bg); font: 600 12px 'Geist Mono', monospace; }
.verb.post { background: #e0a84a; }
.ok { color: var(--accent); }
h1 { font-weight: 700; letter-spacing: -0.03em; }
.chip { padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: #1b2620; font: 12.5px 'Geist Mono', monospace; color: #c9d4cc; }

.glow { left: -260px; bottom: -380px; width: 700px; height: 700px; }
.split { --pad-x: 72px; --text-width: 500px; --split-gap: 52px; }
.api { margin-top: 26px; }
h1 { --h1: 60px; margin: 16px 0 18px; }
.tagline { font-size: 20px; }
.visual.card { border-radius: 12px; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar .api { margin: 0; color: var(--ink); font-size: 14px; }
.tabs { display: flex; gap: 6px; }
.tabs .on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.body { display: grid; gap: 12px; padding: 18px 18px 20px; }
.chips { display: flex; gap: 10px; }
.line { height: 12px; border-radius: 4px; background: #1b2620; }
.pieces { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.piece { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #121915; }
.piece strong { display: block; font-size: 13px; font-weight: 600; }
.piece small { font: 11px 'Geist Mono', monospace; color: #93a399; }
</style>
</head>
<body>
<div class="canvas dots split">
  <div class="glow"></div>
  <div class="text stack">
    <div class="brand"><span class="gdot"></span><span class="brand-name">Mario Gutiérrez</span></div>
    <div class="api"><span class="verb">GET</span>/projects <span class="ok">200 OK</span></div>
    <h1>Projects as<br><span class="accent">case studies</span></h1>
    <p class="tagline">What was broken, the decisions made and what shipped, with multi-part platforms shown as one story.</p>
  </div>
  <div class="visual card">
    <div class="bar">
      <span class="api"><span class="verb">GET</span>/projects/reservadito</span>
      <span class="tabs"><span class="chip on">Preview</span><span class="chip">JSON</span></span>
    </div>
    <div class="body">
      <div class="chips"><span class="chip">problem</span><span class="chip">process</span><span class="chip">results</span></div>
      <div class="line" style="width:88%"></div>
      <div class="line" style="width:72%"></div>
      <div class="pieces">
        <div class="piece"><strong>Customer app</strong><small>piece</small></div>
        <div class="piece"><strong>Backend API</strong><small>piece</small></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
