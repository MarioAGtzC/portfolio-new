<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservadito Customer App · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #111110; --accent: #00afb5; --accent-ink: #44d4d9; --muted: #b8b8b4; }
.glow { left: 150px; top: -160px; width: 900px; height: 620px;
  background: radial-gradient(ellipse, rgb(0 175 181 / 0.20), rgb(19 68 133 / 0.12) 50%, transparent 75%); }
.brand img { width: 44px; height: 44px; border-radius: 10px; }
.brand-name { font-size: 24px; }
.tag { margin-top: 22px; }
h1 { --h1: 56px; margin: 20px 0 16px; }
.tagline { max-width: 700px; font-size: 20px; }
.btn { margin-top: 26px; padding: 13px 30px; border-radius: 999px; background: #00afb5; color: #0b1211; font-size: 18px; font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, 230px); margin-top: 40px; }
.step b { display: grid; place-items: center; width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 11px;
  background: linear-gradient(135deg, #00afb5, #134485); font-size: 18px; }
.step strong { display: block; font-size: 20px; margin-bottom: 4px; }
.step small { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<div class="canvas center">
  <div class="glow"></div>
  <div class="brand"><img src="assets/reservadito-icon-customer.png" alt=""><span class="brand-name">Reservadito</span></div>
  <span class="tag">Customer app</span>
  <h1>Skip the calls.<br><span class="accent">Just book.</span></h1>
  <p class="tagline">Find businesses nearby, see real availability, then book and pay in a few taps, on web, iOS and Android.</p>
  <div class="btn">Find businesses &rarr;</div>
  <div class="steps">
    <div class="step"><b>1</b><strong>Search</strong><small>Businesses on a map</small></div>
    <div class="step"><b>2</b><strong>Book</strong><small>Pick a date and time</small></div>
    <div class="step"><b>3</b><strong>Check in</strong><small>QR code at the business</small></div>
  </div>
</div>

</body>
</html>
