<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MaquilaExpress · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #2a2769; --accent: #00909e; --accent-ink: #4dd9e6; --muted: #c3c6dd; }
.cut-lines { right: 0; top: 0; width: 560px; height: 630px;
  background-image: repeating-linear-gradient(55deg, rgb(0 144 158 / 0.16) 0 2px, transparent 2px 34px); }
.panel-a { right: -60px; top: 90px; width: 460px; height: 460px; border: 2px solid rgb(0 144 158 / 0.55); border-radius: 24px; rotate: 12deg; }
.panel-b { right: 40px; top: 190px; width: 340px; height: 340px; border-radius: 20px; rotate: -8deg;
  background: linear-gradient(135deg, rgb(0 144 158 / 0.35), rgb(39 73 109 / 0.25)); }
.fade { inset: 0; background: linear-gradient(90deg, var(--bg) 0 50%, rgb(42 39 105 / 0.8) 60%, rgb(42 39 105 / 0.25) 74%, transparent 88%); }
.content { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; height: 100%; padding: 0 90px; max-width: 700px; }
.logo { height: 62px; margin-bottom: 32px; }
h1 { --h1: 50px; margin: 22px 0 18px; }
.tagline { max-width: 560px; font-size: 21px; }
.credit { display: flex; align-items: center; gap: 12px; margin-top: 28px; font-size: 16px; color: #8f93b8; }
.credit img { height: 24px; opacity: 0.8; }
</style>
</head>
<body>
<div class="canvas">
  <div class="layer cut-lines"></div>
  <div class="layer panel-a"></div>
  <div class="layer panel-b"></div>
  <div class="layer fade"></div>
  <div class="content">
    <img class="logo" src="assets/maquila-logo-white.png" alt="MaquilaExpress">
    <span class="tag">Custom fabrication</span>
    <h1>Instant quotes for<br><span class="accent">custom-made</span> parts</h1>
    <p class="tagline">Upload a DXF or STL file and get a price right away for laser cutting, CNC routing, plotter cutting or 3D printing.</p>
    <div class="credit"><img src="assets/kioscomatico-k-white.png" alt=""><span>by Kioscomático</span></div>
  </div>
</div>

</body>
</html>
