<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservadito · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #0b285c; --accent: #00afb5; --accent-ink: #44d4d9; --muted: #c3ccdd; }
.glow { left: 150px; top: -180px; width: 900px; height: 620px; border-radius: 50%;
  background: radial-gradient(ellipse, rgb(0 175 181 / 0.22), rgb(247 147 30 / 0.10) 50%, transparent 75%); }
.logo { width: 150px; margin-bottom: 24px; }
h1 { --h1: 46px; margin: 20px 0 16px; }
.tagline { max-width: 680px; font-size: 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, 200px); gap: 20px; margin-top: 32px; }
.tile { padding: 18px 14px; }
.tile .dot { margin: 0 auto 10px; width: 10px; height: 10px; }
.tile strong { display: block; font-size: 16px; }
.tile small { font-size: 12px; color: #93a2c0; }
</style>
</head>
<body>
<div class="canvas center">
  <div class="glow"></div>
  <img class="logo" src="assets/reservadito-logo-text-white.png" alt="">
  <span class="tag">Booking platform</span>
  <h1>One platform,<br><span class="accent">four connected apps</span></h1>
  <p class="tagline">Discovery, scheduling, payments and staff management for service businesses, from one customer, business and admin experience.</p>
  <div class="tiles">
    <div class="card tile"><span class="dot" style="background:#00afb5"></span><strong>Customer</strong><small>Search &amp; book</small></div>
    <div class="card tile"><span class="dot" style="background:#f7931e"></span><strong>Business</strong><small>Manage &amp; earn</small></div>
    <div class="card tile"><span class="dot" style="background:#2563eb"></span><strong>Admin</strong><small>Support &amp; payouts</small></div>
    <div class="card tile"><span class="dot" style="background:#94a3b8"></span><strong>Backend</strong><small>Core API</small></div>
  </div>
</div>

</body>
</html>
