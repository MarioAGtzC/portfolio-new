<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reservadito Business Panel · cover</title>
<link rel="stylesheet" href="_base.css">
<style>
.canvas { --bg: #0f172a; --accent: #f7931e; --accent-ink: #f9bf63; --line: rgb(148 163 184 / 0.15); }
.glow { right: -100px; top: -140px; width: 560px; height: 560px;
  background: radial-gradient(circle, rgb(247 147 30 / 0.16), rgb(0 175 181 / 0.10) 55%, transparent 75%); }
.brand img { width: 42px; height: 42px; border-radius: 9px; }
.tag { margin-top: 30px; }
h1 { --h1: 46px; margin: 22px 0 18px; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 700; color: #e2e8f0; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); }
.col { display: grid; gap: 8px; padding: 16px; border-right: 1px solid rgb(148 163 184 / 0.08); }
.col:last-child { border-right: 0; }
.col b { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; }
.slot { height: 34px; border-radius: 6px; background: rgb(148 163 184 / 0.06); }
.slot.busy { background: linear-gradient(90deg, #134485, #00afb5); opacity: 0.8; }
</style>
</head>
<body>
<div class="canvas split">
  <div class="glow"></div>
  <div class="text stack">
    <div class="brand"><img src="assets/reservadito-icon-business.png" alt=""><div><div class="brand-name">Reservadito</div><div class="brand-sub">Business panel</div></div></div>
    <span class="tag">Business panel</span>
    <h1>Run your business<br>without the <span class="accent">guesswork</span></h1>
    <p class="tagline">Manage branches, staff, schedules and online payments from one dashboard, with QR check-in to confirm every visit.</p>
  </div>
  <div class="visual panel">
    <div class="panel-head"><span class="dot"></span>Today's schedule</div>
    <div class="cols">
      <div class="col"><b>Chair 1</b><i class="slot busy"></i><i class="slot"></i><i class="slot busy"></i><i class="slot"></i></div>
      <div class="col"><b>Chair 2</b><i class="slot"></i><i class="slot busy"></i><i class="slot"></i><i class="slot busy"></i></div>
      <div class="col"><b>Chair 3</b><i class="slot busy"></i><i class="slot busy"></i><i class="slot"></i><i class="slot"></i></div>
    </div>
  </div>
</div>

</body>
</html>
